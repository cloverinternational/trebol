<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
<style>
  :root{--page:#fbfbfa;--card:#ffffff;--t1:#1b1c20;--t2:#55575f;--t3:#6a6c74;--l1:rgba(27,28,32,.06);--l2:rgba(27,28,32,.12);--l3:rgba(27,28,32,.22);--l4:rgba(27,28,32,.45);--warn:#d98a0b;--dot:rgba(27,28,32,.10)}
  @media (prefers-color-scheme: dark){:root{--page:#0f0f12;--card:#161619;--t1:#ededed;--t2:#a1a1a1;--t3:#8a8a92;--l1:rgba(255,255,255,.07);--l2:rgba(255,255,255,.12);--l3:rgba(255,255,255,.22);--l4:rgba(255,255,255,.45);--warn:#f5a524;--dot:rgba(255,255,255,.07)}}
  text{font-family:"Berkeley Mono",ui-monospace,"SF Mono",Menlo,monospace;fill:var(--t1)}
  .sans{font-family:Geist,-apple-system,"SF Pro Text",system-ui,sans-serif}
  .h{font-size:15px;font-weight:600}.s{font-size:12px}.xs{font-size:10.5px;fill:var(--t3)}.cap{font-size:10px;letter-spacing:.08em;fill:var(--t3)}
  .page{fill:var(--page)}.node{fill:var(--card);stroke:var(--l4);stroke-width:1.2}
  .bound{fill:none;stroke:var(--l3);stroke-width:1;stroke-dasharray:4 3}
  .edge{fill:none;stroke:var(--t2);stroke-width:1.3}.hot{stroke:var(--t1);stroke-width:2.2}.async{stroke-dasharray:5 4}
  .rule{stroke:var(--l3);stroke-width:2}.warnrule{stroke:var(--warn);stroke-width:2}
  .ic{fill:none;stroke:var(--t2);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
  .step{fill:var(--t1)}.stepn{fill:var(--page);font-size:10px;font-weight:700}
</style>
<defs>
  <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="var(--dot)"/></pattern>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="var(--t2)"/></marker>
  <marker id="arrh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="var(--t1)"/></marker>
</defs>
<rect class="page" width="900" height="420"/>
<text x="32" y="38" class="h sans">Callouts: before (theme accent fill) vs proposed (rule + icon, no fill)</text>
<text x="32" y="58" class="xs sans">Measured in headless Tern 0.9.5: callout fill differs from page by Δ16–20 RGB today, Δ0 with the proposed sheet (dark-cyberpunk, light-coral, light-cyberpunk).</text>
<text x="32" y="96" class="cap sans">TODAY · light-cyberpunk</text>
<rect x="32" y="108" width="400" height="44" rx="10" fill="#f5e7f5" stroke="#e7c6e7"/>
<circle cx="54" cy="130" r="7" fill="none" stroke="#d61ad6" stroke-width="1.4"/><text x="70" y="134" class="s sans" style="fill:#1b1c20">The bridge owns no state of its own.</text>
<rect x="32" y="164" width="400" height="44" rx="10" fill="#efece4" stroke="#d9d0b4"/>
<path d="M47,140 l7,-13 l7,13z" transform="translate(0,56)" fill="none" stroke="#a88a10" stroke-width="1.4"/><text x="70" y="190" class="s sans" style="fill:#1b1c20">Frames over 64 KiB are rejected.</text>
<text x="32" y="246" class="cap sans">TODAY · light-coral</text>
<rect x="32" y="258" width="400" height="44" rx="10" fill="#feefd7" stroke="#f4cfa0"/>
<circle cx="54" cy="280" r="7" fill="none" stroke="#e8552d" stroke-width="1.4"/><text x="70" y="284" class="s sans" style="fill:#1b1c20">The bridge owns no state of its own.</text>
<text x="32" y="350" class="xs sans">Hue comes from --accent, so every theme repaints the box.</text>

<text x="468" y="96" class="cap sans">PROPOSED · any theme</text>
<line x1="470" y1="110" x2="470" y2="150" class="rule"/>
<circle cx="490" cy="130" r="7" class="ic"/><line x1="490" y1="127" x2="490" y2="134" class="ic"/><text x="506" y="134" class="s sans">The bridge owns no state of its own.</text>
<line x1="470" y1="166" x2="470" y2="206" class="warnrule"/>
<path d="M483,193 l7,-13 l7,13z" fill="none" stroke="var(--warn)" stroke-width="1.4" stroke-linejoin="round"/><text x="506" y="190" class="s sans">Frames over 64 KiB are rejected.</text>
<text x="468" y="246" class="cap sans">RULES</text>
<text x="468" y="268" class="xs">.sf-md .callout { background: transparent; border: 0;</text>
<text x="468" y="284" class="xs">  border-left: 2px solid var(--l3); border-radius: 0 }</text>
<text x="468" y="300" class="xs">.sf-md .callout .co-ic { color: var(--t3) }</text>
<text x="468" y="316" class="xs">.callout.warning|.caution → --warn on rule + icon only</text>
<text x="468" y="350" class="xs sans">Severity stays legible; NOTE/TIP/IMPORTANT read as quiet ink.</text>
<text x="468" y="366" class="xs sans">Tern parser verdict for the 7 rules: 0 errors.</text>
</svg>
