<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="600" viewBox="0 0 1040 600">
<style>
  :root{--page:#fbfbfa;--card:#ffffff;--t1:#1b1c20;--t2:#55575f;--t3:#6a6c74;--l1:rgba(27,28,32,.06);--l2:rgba(27,28,32,.12);--l3:rgba(27,28,32,.22);--l4:rgba(27,28,32,.45);--warn:#d98a0b;--dot:rgba(27,28,32,.10)}
  @media (prefers-color-scheme: dark){:root{--page:#0f0f12;--card:#161619;--t1:#ededed;--t2:#a1a1a1;--t3:#8a8a92;--l1:rgba(255,255,255,.07);--l2:rgba(255,255,255,.12);--l3:rgba(255,255,255,.22);--l4:rgba(255,255,255,.45);--warn:#f5a524;--dot:rgba(255,255,255,.07)}}
  text{font-family:"Berkeley Mono",ui-monospace,"SF Mono",Menlo,monospace;fill:var(--t1)}
  .sans{font-family:Geist,-apple-system,"SF Pro Text",system-ui,sans-serif}
  .h{font-size:15px;font-weight:600}.s{font-size:12px}.xs{font-size:10.5px;fill:var(--t3)}.cap{font-size:10px;letter-spacing:.08em;fill:var(--t3)}
  .page{fill:var(--page)}.node{fill:var(--card);stroke:var(--l4);stroke-width:1.2}
  .bound{fill:none;stroke:var(--l3);stroke-width:1;stroke-dasharray:4 3}
  .edge{fill:none;stroke:var(--t2);stroke-width:1.3}.hot{stroke:var(--t1);stroke-width:2.2}.async{stroke-dasharray:5 4}
  .rule{stroke:var(--l3);stroke-width:2}.warnrule{stroke:var(--warn);stroke-width:2}
  .ic{fill:none;stroke:var(--t2);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
  .step{fill:var(--t1)}.stepn{fill:var(--page);font-size:10px;font-weight:700}
</style>
<defs>
  <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="var(--dot)"/></pattern>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="var(--t2)"/></marker>
  <marker id="arrh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="var(--t1)"/></marker>
</defs>
<rect class="page" width="1040" height="600"/>
<text x="32" y="38" class="h sans">Authoring kit: Mermaid that Tern 0.9.5 actually lays out, theme-neutral</text>
<text x="32" y="58" class="xs sans">Each row was rendered through PiTernBridge → headless tern serve. This is what the model should be told to emit for system answers.</text>
<g class="cap sans"><text x="40" y="96">MEANING</text><text x="200" y="96">SHAPE</text><text x="360" y="96">MERMAID SYNTAX</text><text x="700" y="96">VERIFIED IN TERN</text></g>
<line x1="32" y1="106" x2="1008" y2="106" stroke="var(--l2)"/>
<g class="s">
<text x="40" y="140">actor / user</text><rect x="200" y="122" width="110" height="28" rx="14" class="node"/><text x="360" y="140">U(["User"])</text><text x="700" y="140" class="xs">stadium · renders</text>
<text x="40" y="186">service</text><rect x="200" y="168" width="110" height="28" rx="3" class="node"/><text x="360" y="186">B["PiTernBridge"]</text><text x="700" y="186" class="xs">rect · renders</text>
<text x="40" y="232">runtime / loop</text><rect x="200" y="214" width="110" height="28" rx="3" class="node"/><line x1="208" y1="214" x2="208" y2="242" stroke="var(--l4)"/><line x1="302" y1="214" x2="302" y2="242" stroke="var(--l4)"/><text x="360" y="232">S[["AgentSession"]]</text><text x="700" y="232" class="xs">subroutine · renders</text>
<text x="40" y="278">data store</text><path d="M200,266 v20 a55,6 0 0 0 110,0 v-20" class="node"/><ellipse cx="255" cy="266" rx="55" ry="6" class="node"/><text x="360" y="278">P[("Provider API")]</text><text x="700" y="278" class="xs">cylinder · renders</text>
<text x="40" y="324">output / surface</text><path d="M200,306 h110 v28 h-110 l10,-14z" class="node"/><text x="360" y="324">T>"Tern surface"]</text><text x="700" y="324" class="xs">flag · renders</text>
<text x="40" y="370">trust boundary</text><rect x="200" y="352" width="110" height="28" rx="6" class="bound"/><text x="360" y="370">subgraph rt["Trebol runtime"] … end</text><text x="700" y="370" class="xs">labelled group · renders</text>
<text x="40" y="416">protocol edge</text><path d="M200,410 H306" class="edge" marker-end="url(#arr)"/><text x="360" y="416">S -->|HTTPS| P</text><text x="700" y="416" class="xs">edge label · renders</text>
<text x="40" y="462">async edge</text><path d="M200,456 H306" class="edge async" marker-end="url(#arr)"/><text x="360" y="462">B -.->|TSP frames| T</text><text x="700" y="462" class="xs">dotted · renders</text>
</g>
<line x1="32" y1="490" x2="1008" y2="490" stroke="var(--l2)"/>
<text x="40" y="518" class="cap sans">AVOID</text>
<text x="40" y="544" class="s">architecture-beta</text><text x="360" y="544" class="xs">not laid out: Tern falls back to the raw source block</text>
<text x="40" y="570" class="s">C4Context</text><text x="360" y="570" class="xs">renders, but with hard-coded blue fills that ignore the theme: the "colored boxes" problem</text>
</svg>
