<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Pi double Escape compared with current Tern</title>
  <desc id="desc">Terminal input enters complete-sequence parsing then forks into Pi's conditional double Escape selector flow and current Tern Escape dismissal, cancellation, draft clearing, or close flow. A dotted line marks the proposed integration boundary.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526174"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, sans-serif; fill: #172033; }
      .head { font-size: 24px; font-weight: 700; }
      .sub { font-size: 14px; fill: #526174; }
      .label { font-size: 15px; font-weight: 600; }
      .small { font-size: 13px; }
      .box { fill: #f4f7fb; stroke: #6b7b90; stroke-width: 1.5; rx: 10; }
      .pi { fill: #e9f5ff; stroke: #3182bd; }
      .tern { fill: #edf9f0; stroke: #3a8f57; }
      .proposal { fill: #fff6df; stroke: #c28718; stroke-dasharray: 6 4; }
      .arrow { fill: none; stroke: #526174; stroke-width: 1.7; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #c28718; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .lane { fill: #f9fbfd; stroke: #cbd5e1; stroke-width: 1; rx: 14; }
    </style>
  </defs>
  <text x="40" y="42" class="head">Escape-Escape: Pi source behavior → Tern implementation map</text>
  <text x="40" y="68" class="sub">Solid lines: inspected current behavior. Dotted amber: proposed integration point only.</text>
  <rect x="35" y="95" width="1130" height="95" class="lane"/>
  <text x="55" y="120" class="label">Shared input boundary</text>
  <rect x="70" y="137" width="190" height="38" class="box"/><text x="165" y="161" text-anchor="middle" class="small">Terminal Escape input</text>
  <rect x="365" y="137" width="240" height="38" class="box"/><text x="485" y="161" text-anchor="middle" class="small">Tern splitInput → StdinBuffer</text>
  <rect x="710" y="137" width="210" height="38" class="box"/><text x="815" y="161" text-anchor="middle" class="small">keyEffect: Escape</text>
  <path d="M260 156 H365" class="arrow"/><path d="M605 156 H710" class="arrow"/>
  <rect x="35" y="215" width="545" height="640" class="lane"/>
  <text x="55" y="245" class="label">Pi: interactive-mode.ts onEscape</text>
  <path d="M165 175 V215 H305 V270" class="arrow"/>
  <rect x="130" y="270" width="350" height="52" class="box pi"/><text x="305" y="292" text-anchor="middle" class="small">Streaming / bash context?</text><text x="305" y="310" text-anchor="middle" class="small">Abort/restore/exit bash; no selector</text>
  <rect x="130" y="357" width="350" height="48" class="box pi"/><text x="305" y="386" text-anchor="middle" class="small">Else: editor text empty after trim?</text>
  <rect x="130" y="438" width="350" height="48" class="box pi"/><text x="305" y="467" text-anchor="middle" class="small">doubleEscapeAction = none?</text>
  <rect x="130" y="519" width="350" height="52" class="box pi"/><text x="305" y="541" text-anchor="middle" class="small">Second eligible Escape within 500 ms?</text><text x="305" y="559" text-anchor="middle" class="small">first press stores timestamp</text>
  <rect x="90" y="621" width="205" height="58" class="box pi"/><text x="192" y="646" text-anchor="middle" class="small">action=tree</text><text x="192" y="665" text-anchor="middle" class="small">open tree selector</text>
  <rect x="330" y="621" width="205" height="58" class="box pi"/><text x="432" y="646" text-anchor="middle" class="small">action=fork</text><text x="432" y="665" text-anchor="middle" class="small">open user-message selector</text>
  <text x="138" y="345" class="small">no</text><path d="M305 322 V357" class="arrow"/><path d="M305 405 V438" class="arrow"/><path d="M305 486 V519" class="arrow"/><path d="M305 571 V595 H192 V621" class="arrow"/><path d="M305 595 H432 V621" class="arrow"/>
  <rect x="620" y="215" width="545" height="640" class="lane"/>
  <text x="640" y="245" class="label">Current Tern: bridge.escape()</text>
  <rect x="735" y="270" width="330" height="52" class="box tern"/><text x="900" y="292" text-anchor="middle" class="small">Transient picker / prompt / completion?</text><text x="900" y="310" text-anchor="middle" class="small">dismiss or cancel; render</text>
  <rect x="735" y="365" width="330" height="48" class="box tern"/><text x="900" y="394" text-anchor="middle" class="small">Busy turn?</text>
  <rect x="735" y="450" width="330" height="48" class="box tern"/><text x="900" y="479" text-anchor="middle" class="small">Draft nonempty?</text>
  <rect x="650" y="540" width="150" height="48" class="box tern"/><text x="725" y="569" text-anchor="middle" class="small">Cancel turn</text>
  <rect x="825" y="540" width="150" height="48" class="box tern"/><text x="900" y="569" text-anchor="middle" class="small">Clear draft</text>
  <rect x="1000" y="540" width="140" height="48" class="box tern"/><text x="1070" y="569" text-anchor="middle" class="small">Setting none: close</text>
  <path d="M815 175 V215 H900 V270" class="arrow"/><path d="M900 322 V365" class="arrow"/><path d="M900 413 V450" class="arrow"/><path d="M900 498 V520 H725 V540" class="arrow"/><path d="M900 520 V540" class="arrow"/><path d="M900 520 H1070 V540" class="arrow"/>
  <rect x="655" y="650" width="485" height="112" class="box tern"/><text x="897" y="678" text-anchor="middle" class="label">Idle + empty, setting tree/fork</text><text x="897" y="702" text-anchor="middle" class="small">1st Escape arms 500 ms; 2nd opens tree picker</text><text x="897" y="724" text-anchor="middle" class="small">Select → navigateTree → refresh branch transcript</text><text x="897" y="746" text-anchor="middle" class="small">fork setting reports unavailable (no bridge API)</text>
  <path d="M900 498 V625 H897 V650" class="arrow"/>
  <text x="55" y="825" class="sub">Current Tern handles complete key sequences; dialogs/cancel/draft-clear keep precedence. Pi defaults to tree, supports tree/fork/none.</text>
</svg>
