<text xml:space="preserve" x="62" y="360" font-size="11.5" fill="#a11a14">.swarmpi/execution/*.json</text>
<text xml:space="preserve" x="62" y="380" font-size="11.5" fill="#a11a14">.swarm/claw/{control,supervisor,sessions/*}</text>
<text xml:space="preserve" x="62" y="400" font-size="11.5" fill="#a11a14">.swarm/scheduled_tasks.json</text>
<text xml:space="preserve" x="48" y="450" font-size="11.5" fill="#3b5b8c" font-weight="bold">No blanket .swarm/ ignore: these are inputs, not state.</text>
<rect x="660" y="122" width="512" height="348" rx="10" fill="#f8fafc" stroke="#1f6f36" stroke-width="1.5"/>
<text xml:space="preserve" x="680" y="152" font-size="16" fill="#1f6f36" font-weight="bold">Per-user state root</text>
<text xml:space="preserve" x="680" y="172" font-size="11.5" fill="#5b6472">outside the checkout — one folder per workspace</text>
<text xml:space="preserve" x="680" y="206" font-size="12" fill="#1f6f36">$PI_SWARM_STATE_DIR</text>
<text xml:space="preserve" x="680" y="221" font-size="10.5" fill="#5b6472">else</text>
<text xml:space="preserve" x="680" y="238" font-size="12" fill="#1d2b44">$XDG_STATE_HOME/pi-swarm</text>
<text xml:space="preserve" x="680" y="253" font-size="10.5" fill="#5b6472">else</text>
<text xml:space="preserve" x="680" y="270" font-size="12" fill="#1d2b44">~/.local/state/pi-swarm</text>
<text xml:space="preserve" x="680" y="302" font-size="12" fill="#1d2b44" font-weight="bold">workspaces/&lt;basename&gt;-&lt;sha256(path)[0:12]&gt;/</text>
<text xml:space="preserve" x="680" y="330" font-size="12.5" fill="#1d2b44">claw/runs/</text>
