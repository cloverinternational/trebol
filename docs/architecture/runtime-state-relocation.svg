<text xml:space="preserve" x="30" y="46" font-size="25" fill="#1d2b44" font-weight="bold">Where the bytes go now — and how an existing checkout gets there</text>
<text xml:space="preserve" x="30" y="72" font-size="12.5" fill="#5b6472">commit 05e71fe · observed run of the real store, not a redrawing from memory · generated by tools/docs/runtime-state-diagram.mjs</text>
<text xml:space="preserve" x="30" y="108" font-size="15" fill="#1d2b44" font-weight="bold">1 · Ownership: what stays in your checkout, and what moved out</text>
<rect x="28" y="122" width="520" height="348" rx="10" fill="#f8fafc" stroke="#3b5b8c" stroke-width="1.5"/>
<text xml:space="preserve" x="48" y="152" font-size="16" fill="#3b5b8c" font-weight="bold">Your repository</text>
<text xml:space="preserve" x="48" y="172" font-size="11.5" fill="#5b6472">tracked files you authored — never rewritten by the runtime</text>
<text xml:space="preserve" x="48" y="204" font-size="12.5" fill="#1d2b44">.swarm/AGENTS.md</text>
<text xml:space="preserve" x="250" y="204" font-size="12" fill="#333333">instruction context</text>
<text xml:space="preserve" x="48" y="232" font-size="12.5" fill="#1d2b44">.swarm/SWARM.md</text>
<text xml:space="preserve" x="250" y="232" font-size="12" fill="#333333">project rules</text>
<text xml:space="preserve" x="48" y="260" font-size="12.5" fill="#1d2b44">.swarm/skills/</text>
<text xml:space="preserve" x="250" y="260" font-size="12" fill="#333333">project skills</text>
<text xml:space="preserve" x="48" y="288" font-size="12.5" fill="#1d2b44">.claude/settings.json</text>
<text xml:space="preserve" x="250" y="288" font-size="12" fill="#333333">hook config</text>
